[package]
name = "seqlings"
version = "7.3.0"
edition = "2024"
description = "Interactive exercises for learning Seq, a stack-based programming language"
license = "MIT"
repository = "https://git.navicore.tech/navicore/seqlings"

[[bin]]
name = "seqlings"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
toml = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "3"
ctrlc = "3"
notify = "8"
notify-debouncer-mini = "0.7"
include_dir = "0.7"
